# Company registry. Mirrored into the `companies` / `company_sources` tables on every fetch.
#
# Fields:
#   slug         registry key (stable; used in config.dream_list / floor_exempt_companies / blocked_companies)
#   tier         1 = Tier-1 alert list (15-min), 2 = hourly, 3 = long tail (6h)
#   category     target category from config.target_ranking
#   quant_firm   true → §1c winnability cap, no finance-domain fit bonus
#   sources      one or more ATS boards. slug formats: greenhouse/lever/ashby/workable/recruitee "slug";
#                smartrecruiters "CompanyIdentifier"; workday "tenant/wdN/site"; oracle "host/siteNumber"
#   enabled      false keeps the entry (alias matching still works) but never polls it
#   sources: []  company is covered via the aggregator repos only (see `note`)
#
# This is a SAMPLE registry of public boards so a fresh clone fetches real postings. Tiers and
# categories are illustrative — edit them for your own search. Auto-discovered employers land
# in config/companies.discovered.yaml (same schema, tier 3, git-ignored until you promote them).
# Optional per-company field `alumni_presence: strong|some|unknown` feeds the referral heuristic.

