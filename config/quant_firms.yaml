# §1c — hardcoded exclusion. Roles at these firms stay in the master list but get
# winnability capped (modifiers.quant_trading_firm_winnability_cap) and NO finance-domain fit bonus.
# A rotational-program title at the baseline employer is NEVER treated as evidence of quant
# capability — `operator.treat_as_quant_candidate: false` is asserted in tests.
#
# Matching is on lowercase company-name substring; slugs are registry keys when present.

