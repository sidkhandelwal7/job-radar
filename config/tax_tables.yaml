# State + local income tax, versioned 2026-08.
# effective_rate_at_100k: approximate EFFECTIVE (not marginal) state+local income tax rate for a
#   single filer with ~$100k wages, standard deductions, 2026 brackets as best known. Federal tax
#   is identical everywhere and is excluded — only the delta vs. the baseline metro's jurisdiction
#   (metros.yaml `tax` of config.baseline.metro) matters.
# These are estimates for ranking; they are shown as "≈" in the UI, never as tax advice.

version: 2026-08

jurisdictions:
