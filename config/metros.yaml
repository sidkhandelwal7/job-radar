# Metro reference table. Versioned 2026-08.
#
# col_index: rent-weighted cost-of-living index, DC metro = 100 (only ratios matter; the baseline
#   metro's own value is the reference). These are approximate,
#   assembled from public rent indices (Zillow ZORI / Apartment List style) as of mid-2026 and
#   rounded. They are a PRIOR for the informational `real_terms_vs_baseline` figure — edit freely.
# premium_bucket: which `location_utility_premium` entry applies (config.yaml §9b).
# tax: jurisdiction key into tax_tables.yaml.
# aliases: lowercase substrings/phrases that map a raw location string to this metro.
#   Matching is: exact alias → city+state pattern → alias substring. First match wins, ordered by
#   alias length (longest first) so "new york city" beats "york".

