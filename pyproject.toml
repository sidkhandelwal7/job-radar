[project]
name = "job-radar"
version = "0.1.0"
description = "Job Radar — new-grad job discovery, ranking against a baseline offer, and application tracking. $0/month."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "pypdf>=4.2",
    "markdownify>=0.12",
    "lark>=1.1",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
lca = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF012", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["radar"]
